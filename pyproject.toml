[project]
name = "petsafe-control"
version = "1.4.0"
description = "Home Assistant custom component for PetSafe Smart Feed feeders and ScoopFree litter boxes"
readme = "README.md"
requires-python = ">=3.14.3"
dependencies = [
    "homeassistant>=2026.3.4",
    "petsafe==2.0.6",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=1.3.0",
    "pytest-homeassistant-custom-component>=0.13.322",
    "pytest-cov>=7.0.0",
    "ruff>=0.15.10",
]
